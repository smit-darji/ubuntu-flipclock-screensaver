name: Build and Release Debian Package

on:
  push:
    branches:
      - Master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2  # Fetch parent commit to compare versions

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect version changes & update documentation
        run: |
          NEW_VERSION=$(grep -o 'APP_VERSION = "[^"]*"' flipclock.py | cut -d'"' -f2)
          OLD_VERSION=$(grep -o 'Version-v[0-9.]*-blue' README.md | sed -E 's/Version-v([0-9.]+)-blue/\1/')
          
          echo "Old Version: $OLD_VERSION"
          echo "New Version: $NEW_VERSION"
          
          if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "Updating version references in README.md from $OLD_VERSION to $NEW_VERSION..."
            sed -i "s/$OLD_VERSION/$NEW_VERSION/g" README.md
          fi

      - name: Build Debian package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Commit and push changes
        run: |
          git add README.md build_deb.sh releases/
          
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes to release files or README.md."
          else
            git commit -m "Auto-build release package & update README for version $(grep -o 'APP_VERSION = "[^"]*"' flipclock.py | cut -d'"' -f2) [skip ci]"
            git push origin Master
          fi
