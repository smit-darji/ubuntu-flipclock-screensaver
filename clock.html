<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Clock Screensaver</title>
    <!-- Google Fonts with local fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Outfit', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: none;
        }

        /* Screen Saver Container (Centered) */
        .screensaver-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4.5vh;
            will-change: transform;
        }

        /* Clock Row */
        .clock-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4.5vh;
        }

        /* Flip Card Base */
        .flip-card {
            position: relative;
            width: 56vh;
            height: 74vh;
            background-color: #1a1a1a;
            border-radius: 5.5vh;
            box-shadow: 0 5vh 10vh rgba(0, 0, 0, 0.95),
                        0 1.2vh 2.5vh rgba(0, 0, 0, 0.4),
                        inset 0 0.15vh 0.3vh rgba(255, 255, 255, 0.08);
            border: 0.25vh solid #2d2d2d;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Card Halves */
        .card-half {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            background-color: #1a1a1a;
        }

        .card-top {
            top: 0;
            align-items: flex-start;
            background: linear-gradient(to bottom, #222222 0%, #1a1a1a 100%);
            border-bottom: 0.2vh solid rgba(0, 0, 0, 0.6);
        }

        .card-bottom {
            bottom: 0;
            align-items: flex-end;
            background: linear-gradient(to bottom, #1a1a1a 0%, #121212 100%);
            border-top: 0.1vh solid rgba(255, 255, 255, 0.03);
        }

        /* Middle crease line */
        .card-divider {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 0.3vh;
            background-color: #060606;
            z-index: 10;
            box-shadow: 0 0.15vh 0.3vh rgba(255, 255, 255, 0.04);
        }

        /* Text inside card */
        .digit-text {
            font-size: 47vh;
            font-weight: 800;
            color: #e2e2e2;
            letter-spacing: -1vh;
            line-height: 74vh;
            font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
            text-align: center;
        }

        .card-top .digit-text {
            margin-top: 0;
        }

        .card-bottom .digit-text {
            margin-top: -37vh;
        }

        /* Flipper Animation Elements */
        .flipper {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            z-index: 4;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .flipper-top {
            top: 0;
            align-items: flex-start;
            background: linear-gradient(to bottom, #202020 0%, #181818 100%);
            transform-origin: bottom center;
            border-bottom: 0.2vh solid rgba(0, 0, 0, 0.6);
        }

        .flipper-bottom {
            bottom: 0;
            align-items: flex-end;
            background: linear-gradient(to bottom, #181818 0%, #121212 100%);
            transform-origin: top center;
        }

        .flipper-top .digit-text {
            margin-top: 0;
        }

        .flipper-bottom .digit-text {
            margin-top: -37vh;
        }

        @keyframes flipTop {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipBottom {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        .flip-top {
            animation: flipTop 0.25s cubic-bezier(0.37, 0.01, 0.63, 1) forwards;
        }

        .flip-bottom {
            animation: flipBottom 0.25s cubic-bezier(0.37, 0.01, 0.63, 1) forwards;
        }

        /* AM/PM Indicator inside Hour Card */
        .ampm-indicator {
            position: absolute;
            top: 5.5%;
            left: 7.5%;
            font-size: 3.2vh;
            font-weight: 800;
            color: #333333;
            text-transform: uppercase;
            letter-spacing: 0.1vh;
            line-height: 1.1;
            z-index: 5;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .ampm-active {
            color: #b5b5b5;
        }

        /* Small Card for Seconds */
        .flip-card-small {
            width: 28vh;
            height: 37vh;
            border-radius: 3vh;
            border: 0.18vh solid #2d2d2d;
            box-shadow: 0 3vh 6vh rgba(0, 0, 0, 0.95),
                        0 0.75vh 1.5vh rgba(0, 0, 0, 0.4),
                        inset 0 0.08vh 0.15vh rgba(255, 255, 255, 0.08);
        }

        .flip-card-small .digit-text {
            font-size: 24vh;
            line-height: 37vh;
        }

        .flip-card-small .card-top .digit-text {
            margin-top: 0;
        }

        .flip-card-small .card-bottom .digit-text {
            margin-top: -18.5vh;
        }

        .flip-card-small .flipper-top .digit-text {
            margin-top: 0;
        }

        .flip-card-small .flipper-bottom .digit-text {
            margin-top: -18.5vh;
        }

        /* Date Display */
        .date-display {
            font-size: 4.2vh;
            font-weight: 600;
            color: #888888;
            letter-spacing: 0.8vh;
            font-family: 'Inter', system-ui, sans-serif;
            text-align: center;
            text-transform: uppercase;
            margin-top: 2.5vh;
            text-shadow: 0 0.2vh 0.4vh rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="screensaver-container">
        <!-- Clock Row -->
        <div class="clock-row">
            <!-- HOUR CARD -->
            <div class="flip-card" id="hours-card">
                <div class="ampm-indicator">
                    <span id="am-indicator">AM</span><br>
                    <span id="pm-indicator">PM</span>
                </div>
                
                <div class="card-half card-top">
                    <span class="digit-text" id="hours-top">00</span>
                </div>
                
                <div class="card-half card-bottom">
                    <span class="digit-text" id="hours-bottom">00</span>
                </div>
                
                <div class="card-divider"></div>
            </div>
            
            <!-- MINUTE CARD -->
            <div class="flip-card" id="minutes-card">
                <div class="card-half card-top">
                    <span class="digit-text" id="minutes-top">00</span>
                </div>
                
                <div class="card-half card-bottom">
                    <span class="digit-text" id="minutes-bottom">00</span>
                </div>
                
                <div class="card-divider"></div>
            </div>

            <!-- SECOND CARD -->
            <div class="flip-card flip-card-small" id="seconds-card">
                <div class="card-half card-top">
                    <span class="digit-text" id="seconds-top">00</span>
                </div>
                
                <div class="card-half card-bottom">
                    <span class="digit-text" id="seconds-bottom">00</span>
                </div>
                
                <div class="card-divider"></div>
            </div>
        </div>

        <!-- Date Display -->
        <div class="date-display" id="date-display">...</div>
    </div>

    <script>
        // Exit signal to WebKitGTK
        let enableExit = false;
        let startX = null;
        let startY = null;
        const MOVE_THRESHOLD = 30;

        setTimeout(() => { enableExit = true; }, 600);

        function requestExit(reason) {
            if (!enableExit) return;
            console.log("DOM exit:", reason);
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.screensaverExit) {
                window.webkit.messageHandlers.screensaverExit.postMessage(reason);
            }
        }

        window.addEventListener('keydown', (e) => requestExit('keydown:' + e.key));
        window.addEventListener('mousedown', (e) => requestExit('mousedown'));
        window.addEventListener('touchstart', (e) => requestExit('touchstart'));
        window.addEventListener('wheel', (e) => requestExit('wheel'), { passive: true });

        window.addEventListener('mousemove', (e) => {
            if (startX === null || startY === null) {
                startX = e.clientX;
                startY = e.clientY;
                return;
            }
            if (!enableExit) {
                startX = e.clientX;
                startY = e.clientY;
                return;
            }
            const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
            if (dist > MOVE_THRESHOLD) {
                requestExit(`mousemove (${dist.toFixed(1)}px)`);
            }
        });

        // Configuration
        const urlParams = new URLSearchParams(window.location.search);
        const cfg = window.screensaverConfig || {};
        const format = cfg.format || urlParams.get('format') || '12';

        let currentHours = "";
        let currentMinutes = "";
        let currentSeconds = "";

        function createFlipper(card, text, isTop) {
            const flipper = document.createElement('div');
            flipper.className = `flipper ${isTop ? 'flipper-top' : 'flipper-bottom'}`;
            const span = document.createElement('span');
            span.className = 'digit-text';
            span.textContent = text;
            flipper.appendChild(span);
            card.appendChild(flipper);
            return flipper;
        }

        function animateCard(cardId, oldVal, newVal, topId, bottomId) {
            const card = document.getElementById(cardId);
            if (!card) return;

            const flipTop = createFlipper(card, oldVal, true);
            const flipBottom = createFlipper(card, newVal, false);
            flipBottom.style.transform = 'rotateX(90deg)';

            flipTop.classList.add('flip-top');

            setTimeout(() => {
                flipTop.remove();
                document.getElementById(topId).textContent = newVal;
                flipBottom.classList.add('flip-bottom');
            }, 250);

            setTimeout(() => {
                flipBottom.remove();
                document.getElementById(bottomId).textContent = newVal;
            }, 500);
        }

        function updateClock(init = false) {
            const now = new Date();
            let hoursNum = now.getHours();
            let minutesNum = now.getMinutes();
            let secondsNum = now.getSeconds();
            
            let ampmVal = "";
            if (format === '12') {
                ampmVal = hoursNum >= 12 ? 'PM' : 'AM';
                hoursNum = hoursNum % 12;
                if (hoursNum === 0) hoursNum = 12;
            }
            
            let hourVal = hoursNum.toString().padStart(2, '0');
            let minuteVal = minutesNum.toString().padStart(2, '0');
            let secondVal = secondsNum.toString().padStart(2, '0');
            
            const amIndicator = document.getElementById('am-indicator');
            const pmIndicator = document.getElementById('pm-indicator');
            const ampmBox = document.querySelector('.ampm-indicator');
            
            if (format === '24') {
                if (ampmBox) ampmBox.style.display = 'none';
            } else {
                if (ampmBox) ampmBox.style.display = 'block';
                if (amIndicator && pmIndicator) {
                    if (ampmVal.includes('AM')) {
                        amIndicator.classList.add('ampm-active');
                        pmIndicator.classList.remove('ampm-active');
                    } else {
                        amIndicator.classList.remove('ampm-active');
                        pmIndicator.classList.add('ampm-active');
                    }
                }
            }

            if (init) {
                document.getElementById('hours-top').textContent = hourVal;
                document.getElementById('hours-bottom').textContent = hourVal;
                document.getElementById('minutes-top').textContent = minuteVal;
                document.getElementById('minutes-bottom').textContent = minuteVal;
                document.getElementById('seconds-top').textContent = secondVal;
                document.getElementById('seconds-bottom').textContent = secondVal;
            } else {
                if (hourVal !== currentHours) animateCard('hours-card', currentHours, hourVal, 'hours-top', 'hours-bottom');
                if (minuteVal !== currentMinutes) animateCard('minutes-card', currentMinutes, minuteVal, 'minutes-top', 'minutes-bottom');
                if (secondVal !== currentSeconds) animateCard('seconds-card', currentSeconds, secondVal, 'seconds-top', 'seconds-bottom');
            }

            currentHours = hourVal;
            currentMinutes = minuteVal;
            currentSeconds = secondVal;

            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('date-display').textContent = new Intl.DateTimeFormat(undefined, dateOptions).format(now).toUpperCase();
        }

        // Precision sync loop aligning to system clock top-of-second (000ms)
        function scheduleNextTick() {
            const now = new Date();
            const delay = 1000 - now.getMilliseconds();
            setTimeout(() => {
                updateClock(false);
                scheduleNextTick();
            }, delay);
        }

        updateClock(true);
        scheduleNextTick();
    </script>
</body>
</html>
